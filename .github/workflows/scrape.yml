name: Scrape FCI Results

on:
  schedule:
    # Ogni 30 minuti, marzo (3) → ottobre (10)
    # Nota: GitHub Actions può ritardare o saltare i cron su repo poco attivi.
    # Usa "Run workflow" manuale se hai bisogno di un aggiornamento immediato.
    - cron: '*/30 * * 3-10 *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forza scraping anche se nessuna modifica rilevata'
        required: false
        default: 'false'

permissions:
  contents: write

# Evita run sovrapposti (lo scrape può essere lanciato sia da cron sia da Render)
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run main scraper (results + rankings)
        run: python scraper/fci_complete_scraper.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Run race details scraper (informazioni tecniche gare)
        run: python scraper/race_details_scraper.py
        continue-on-error: true
        timeout-minutes: 20
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit & push data
        id: commitstep
        run: |
          git config user.email "bot@italiacrit.it"
          git config user.name "ItaliacritBot"
          # Aggiungi SOLO i file JSON e le cartelle ranking (mai i .log)
          git add -f data/*.json
          git add -f data/rankings/ data/team_rankings/ 2>/dev/null || true
          # Archivio stagionale (storicità): snapshot congelati per anno
          git add -f data/seasons/ 2>/dev/null || true
          # Rimuovi dal tracking i log eventualmente entrati per errore
          git rm --cached data/unmatched_races.log data/service.log 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "update: $(date -u '+%Y-%m-%d %H:%M') UTC"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Push robusto: con pages/keepalive che spingono in parallelo, un push
            # può fallire (non-fast-forward). Riprova con rebase finché passa.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && { echo "push OK"; break; }
              echo "push fallito, retry $i…"; sleep $((RANDOM % 6 + 4))
            done
          fi

      - name: Ping Render (keep server awake)
        run: |
          curl -s -o /dev/null -w "Render: %{http_code}\n" --max-time 30 https://italiacrit.onrender.com/api/health || true

      - name: Notifica push (solo se ci sono novità)
        if: steps.commitstep.outputs.changed == 'true'
        run: |
          curl -s -X POST https://italiacrit.onrender.com/api/internal/notify-results \
            -H "Content-Type: application/json" \
            -H "x-notify-token: ${{ secrets.SCRAPE_NOTIFY_TOKEN }}" \
            --max-time 30 \
            -d '{"title":"🏁 Risultati aggiornati","body":"Nuove classifiche e risultati disponibili"}' || true
