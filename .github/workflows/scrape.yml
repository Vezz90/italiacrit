name: Scrape FCI Results

on:
  schedule:
    # Ogni 30 minuti, marzo (3) → ottobre (10)
    # Nota: GitHub Actions può ritardare o saltare i cron su repo poco attivi.
    # Usa "Run workflow" manuale se hai bisogno di un aggiornamento immediato.
    - cron: '*/30 * * 3-10 *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forza scraping anche se nessuna modifica rilevata'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run main scraper (results + rankings)
        run: python scraper/fci_complete_scraper.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Run race details scraper (informazioni tecniche gare)
        run: python scraper/race_details_scraper.py
        continue-on-error: true
        timeout-minutes: 20
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit & push data
        run: |
          git config user.email "bot@italiacrit.it"
          git config user.name "ItaliacritBot"
          git add -f data/
          git diff --staged --quiet || git commit -m "update: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
