name: Keep-Alive

# Gira ogni 20 minuti tutto l'anno:
# - Pinga Render per evitare che si addormenti (free tier dorme dopo ~15 min)
# - Mantiene il repo attivo così GitHub non rallenta/salta il cron di scrape.yml
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render (keep server awake)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://italiacrit.onrender.com/api/health)
          echo "Render health: $STATUS"
          # Non fallire se Render non risponde (si sta svegliando)
          exit 0

      - name: Keep repo active (prevent GitHub Actions throttling)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Touch keepalive timestamp
        run: |
          mkdir -p .github
          echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .github/keepalive.txt
          git config user.email "bot@italiacrit.it"
          git config user.name "ItaliacritBot"
          git add .github/keepalive.txt
          # Commit solo se il file è cambiato (ogni run aggiorna il timestamp)
          git diff --staged --quiet || git commit -m "keepalive: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
