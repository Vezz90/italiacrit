name: Keep-Alive

# Gira ogni 10 minuti — Render free dorme dopo ~15 min di inattività,
# quindi 10 min garantisce margine anche se GitHub Actions ritarda il cron.
# Chiama /api/cron/tick che: (1) tiene sveglio Render, (2) lancia le sync
# foto/video in background (throttle interno 25 min) — così le sync girano
# anche se l'setInterval interno di Render si è fermato per uno sleep.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# Evita run sovrapposti
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render + trigger sync
        run: |
          # Retry: se Render dorme, la prima richiesta lo sveglia (puo' tardare ~50s)
          for i in 1 2 3; do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 80 https://italiacrit.onrender.com/api/cron/tick)
            echo "Tentativo $i - cron/tick: $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 10
          done
          exit 0

      - name: Keep repo active (prevent GitHub Actions throttling)
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Touch keepalive timestamp
        run: |
          mkdir -p .github
          echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .github/keepalive.txt
          git config user.email "bot@italiacrit.it"
          git config user.name "ItaliacritBot"
          git add .github/keepalive.txt
          git diff --staged --quiet || git commit -m "keepalive: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
