name: Keep-Alive

# Gira ogni 10 minuti — Render free dorme dopo ~15 min di inattività.
# Chiama /api/cron/tick che: (1) tiene sveglio Render, (2) lancia le sync
# foto/video, (3) ogni 30 min triggera lo scrape via API GitHub.
# NB: il cron di GitHub è inaffidabile; per orari regolari usare un pinger
# esterno (es. cron-job.org / UptimeRobot) verso /api/cron/tick. Questo
# workflow resta come fallback "best effort".
# Non committa più nulla: i commit ogni 10 min causavano conflitti di push
# e build di Pages inutili.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# Evita run sovrapposti
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render + trigger sync
        run: |
          # Retry: se Render dorme, la prima richiesta lo sveglia (puo' tardare ~50s)
          for i in 1 2 3; do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 80 https://italiacrit.onrender.com/api/cron/tick)
            echo "Tentativo $i - cron/tick: $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 10
          done
          exit 0
