name: Trigger Render Deploy

# Il webhook automatico GitHub -> Render (impostato nella dashboard Render)
# si è dimostrato inaffidabile: molti push restavano "non deployati" per ore
# senza nessun evento visibile nella dashboard, richiedendo un "Manual Deploy"
# a mano ogni volta. Questo workflow lo sostituisce con un trigger esplicito
# e verificabile (log dello step con lo status HTTP di risposta) ad ogni push
# su main, tramite il Deploy Hook di Render (Settings -> Deploy Hook del
# servizio), salvato come secret RENDER_DEPLOY_HOOK.
#
# Eccezione: il push dello scraper dei risultati (messaggio "update: ..." che
# tocca solo data/) NON riavvia Render — il backend rilegge i dati da solo —
# ma la cache Cloudflare viene comunque svuotata, cosi' i risultati nuovi si
# vedono subito. Ogni altro push (codice, pagine, dati scritti dal server)
# continua a fare il deploy completo.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cosa è cambiato
        id: chg
        env:
          BEFORE: ${{ github.event.before }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          backend=true
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            echo "$files" | head -20
            solo_dati=true
            while IFS= read -r f; do
              case "$f" in data/*) ;; *) solo_dati=false ;; esac
            done <<< "$files"
            case "$MSG" in "update: "*) scrape=true ;; *) scrape=false ;; esac
            if [ "$solo_dati" = true ] && [ "$scrape" = true ]; then backend=false; fi
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "Serve il deploy del backend: $backend"

      - name: Trigger Render deploy hook
        if: steps.chg.outputs.backend == 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Render deploy hook risposta HTTP: $code"
          if [ "$code" -ge 300 ]; then
            echo "::error::Deploy hook fallito (HTTP $code)"
            exit 1
          fi

      # Cloudflare mette in cache app.js/design.css (max-age 1h sull'origin,
      # ma un edge node sfortunato che fa la prima fetch durante la finestra
      # di rolling-restart di Render può bloccare contenuto stale per ore,
      # a prescindere dal bump di ?v=NNN in index.html). Aspettiamo che il
      # rolling restart di Render finisca, poi svuotiamo la cache della zona
      # cosi' il prossimo utente prende sempre la versione appena deployata.
      - name: Attendi il rolling restart di Render
        run: sleep 90

      - name: Svuota cache Cloudflare
        run: |
          code=$(curl -s -o /tmp/purge.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/de725bcc6d7f1aaaf217172d16660535/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "Cloudflare purge_cache risposta HTTP: $code"
          cat /tmp/purge.json
          if [ "$code" -ge 300 ]; then
            echo "::error::Purge cache Cloudflare fallito (HTTP $code)"
            exit 1
          fi
