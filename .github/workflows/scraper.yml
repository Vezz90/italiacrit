name: Update Italiacrit Data

# Run automatically every day at 00:00 UTC and natively manually via workflow_dispatch
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install browser binaries for playwright (if needed)
        run: |
          playwright install chromium

      - name: Run Scraper
        run: |
          python scraper/fci_final_v4.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Auto-update race data and rankings"
          git push
