<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ItaliacritResultati — Ciclismo Italiano Agonistico</title>
  <meta name="description" content="Classifiche, risultati e statistiche del ciclismo agonistico italiano su strada. Esordienti, Allievi, Juniores, Under23 ed Elite — uomini e donne." />

  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <!-- Applica il tema salvato PRIMA del render per evitare flash -->
  <script>try { const t = localStorage.getItem('italiacrit-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e){}</script>
</head>

<nav id="navbar" role="navigation" aria-label="Navigazione principale">

    ITALIA<span class="red">CRIT</span>
  </a>
  <div class="nav-sep" aria-hidden="true"></div>
  <div class="nav-links" role="list">
    <a href="#/"           class="nav-link" id="nav-home"      role="listitem">Home</a>
    <a href="#/classifica" class="nav-link" id="nav-class"     role="listitem">Classifica</a>

  </button>

  </button>
</nav>

  <a href="#/"           class="nav-link" id="drawer-home">Home</a>

<script>

    window.addEventListener('load', () => {
